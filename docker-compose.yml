# Woodwolf ERPNext production stack on Coolify (Docker Compose build pack)
#
# Services: configurator, create-site, backend, frontend, websocket,
# queue-short, queue-long, scheduler, db (MariaDB), redis-cache,
# redis-queue, backup.
#
# Persistent volumes (all named, survive container recreation and redeploy):
#   woodwolf-erpnext-db-data          -> MariaDB /var/lib/mysql
#   woodwolf-erpnext-sites            -> /home/frappe/frappe-bench/sites,
#                                        shared by backend, frontend,
#                                        websocket, both workers, scheduler,
#                                        configurator, create-site and backup
#   woodwolf-erpnext-logs             -> bench logs
#   woodwolf-erpnext-redis-queue-data -> Redis queue AOF persistence
#   woodwolf-erpnext-backups          -> daily/weekly backups, outside the
#                                        sites volume
# Never run `docker compose down -v` against this stack.
#
# Environment variables (set in Coolify, never committed):
#   SITE_NAME         Frappe site / public domain, e.g. manager.woodwolfdigital.com
#   FRAPPE_IMAGE      custom image tag, default woodwolf-erpnext:v16.55.0
#   ADMIN_PASSWORD    ERPNext Administrator password (first site creation only)
#   DB_ROOT_PASSWORD  MariaDB root password

services:
  configurator:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.55.0}"
    # No build: the deploy uses the prebuilt image set in Coolify
    # (FRAPPE_IMAGE=developercrayon/erpnext-custom:v16-helpdesk-compat,
    # pulled to the server before deploy). The Dockerfile in this repo is
    # kept as the build source only.
    pull_policy: never
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - "-c"
    command:
      - >
        set -e;
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
        bench set-config -g default_site $$SITE_NAME;
    environment:
      SITE_NAME: "${SITE_NAME}"
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: "redis-cache:6379"
      REDIS_QUEUE: "redis-queue:6379"
      SOCKETIO_PORT: "9000"
    volumes:
      - "woodwolf-erpnext-sites:/home/frappe/frappe-bench/sites"
      - "woodwolf-erpnext-logs:/home/frappe/frappe-bench/logs"

  create-site:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.55.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: none
    volumes:
      - "woodwolf-erpnext-sites:/home/frappe/frappe-bench/sites"
      - "woodwolf-erpnext-logs:/home/frappe/frappe-bench/logs"
    environment:
      SITE_NAME: "${SITE_NAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    entrypoint:
      - bash
      - "-c"
    # Literal block (|), not folded (>): with >, the more-indented
    # continuation lines of bench new-site kept their newlines, so bash
    # ran `bench new-site <site>` with NO options. That made Frappe prompt
    # interactively for the MySQL root password and crash with EOFError.
    # With | the script reaches bash exactly as written.
    command:
      - |
        set -e;
        wait-for-it -t 180 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        until grep -q '"db_host"' sites/common_site_config.json 2>/dev/null; do
          echo "Waiting for configurator...";
          sleep 5;
        done;
        # Create the site only if it is missing or unusable. A failed deploy
        # can leave a site directory (site_config.json) without the MariaDB
        # user and database, which makes a plain "directory exists" check
        # skip creation and every later bench command fail with MySQL 1045.
        # Test the site first; if it does not answer, remove the partial
        # directory and create it fresh. A healthy site is never touched.
        if ! bench --site "$${SITE_NAME}" list-apps >/dev/null 2>&1; then
          [ -n "$${SITE_NAME}" ] && rm -rf "sites/$${SITE_NAME}";
          bench new-site "$${SITE_NAME}" --mariadb-user-host-login-scope='%' --admin-password="$${ADMIN_PASSWORD}" --db-root-username=root --db-root-password="$${DB_ROOT_PASSWORD}" --set-default;
        fi;
        for app in payments erpnext hrms telephony helpdesk crm wiki; do
          if grep -qx "$${app}" sites/apps.txt; then
            if ! bench --site "$${SITE_NAME}" list-apps | grep -qx "$${app}"; then
              bench --site "$${SITE_NAME}" install-app "$${app}";
            fi;
          else
            echo "Skipping $${app}: not present in this image";
          fi;
        done;
        bench --site "$${SITE_NAME}" migrate;
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  backend:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.55.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - "woodwolf-erpnext-sites:/home/frappe/frappe-bench/sites"
      - "woodwolf-erpnext-logs:/home/frappe/frappe-bench/logs"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  frontend:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.55.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    # The sites volume's assets entry is a symlink to the container-local
    # /home/frappe/frappe-bench/assets, so a bench build in the backend does
    # not make Helpdesk assets visible to the frontend. The frontend image
    # already carries the built Helpdesk files under
    # apps/helpdesk/helpdesk/public, it only lacks this symlink, which is
    # why /helpdesk was blank white (all assets 404). Create it at every
    # frontend start so a redeploy or container recreation does not lose it.
    command:
      - sh
      - -c
      - |
        if [ -d /home/frappe/frappe-bench/apps/helpdesk/helpdesk/public ]; then ln -sfn /home/frappe/frappe-bench/apps/helpdesk/helpdesk/public /home/frappe/frappe-bench/assets/helpdesk; fi; exec nginx-entrypoint.sh
    environment:
      BACKEND: "backend:8000"
      SOCKETIO: "websocket:9000"
      FRAPPE_SITE_NAME_HEADER: "${SITE_NAME}"
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
    volumes:
      - "woodwolf-erpnext-sites:/home/frappe/frappe-bench/sites"
      - "woodwolf-erpnext-logs:/home/frappe/frappe-bench/logs"
    labels:
      - traefik.enable=true
      # Domain is hardcoded here (not ${SITE_NAME}): Coolify does not
      # substitute variables inside Traefik labels, so the literal
      # placeholder reached Traefik and Let's Encrypt rejected it.
      - 'traefik.http.routers.erpnext-router.rule=Host(`manager.woodwolfdigital.com`)'
      - traefik.http.routers.erpnext-router.entrypoints=https
      - traefik.http.routers.erpnext-router.tls=true
      - traefik.http.routers.erpnext-router.tls.certresolver=letsencrypt
      - traefik.http.services.erpnext.loadbalancer.server.port=8080
    depends_on:
      - backend
      - websocket

  websocket:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.55.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - "woodwolf-erpnext-sites:/home/frappe/frappe-bench/sites"
      - "woodwolf-erpnext-logs:/home/frappe/frappe-bench/logs"
    environment:
      FRAPPE_REDIS_CACHE: "redis://redis-cache:6379"
      FRAPPE_REDIS_QUEUE: "redis://redis-queue:6379"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.55.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - "--queue"
      - "short,default"
    volumes:
      - "woodwolf-erpnext-sites:/home/frappe/frappe-bench/sites"
      - "woodwolf-erpnext-logs:/home/frappe/frappe-bench/logs"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  queue-long:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.55.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - "--queue"
      - "long,default,short"
    volumes:
      - "woodwolf-erpnext-sites:/home/frappe/frappe-bench/sites"
      - "woodwolf-erpnext-logs:/home/frappe/frappe-bench/logs"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  scheduler:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.55.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - "woodwolf-erpnext-sites:/home/frappe/frappe-bench/sites"
      - "woodwolf-erpnext-logs:/home/frappe/frappe-bench/logs"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  backup:
    image: "${FRAPPE_IMAGE:-woodwolf-erpnext:v16.55.0}"
    pull_policy: never
    deploy:
      restart_policy:
        condition: on-failure
    entrypoint:
      - bash
      - "-c"
    # Backup logic is inline (not bash backup.sh): the prebuilt image does
    # not carry backup.sh, so the daily backup plus retention lives here.
    # Retention: 7 daily copies, plus a Sunday copy kept for 4 weeks.
    command:
      - |
        set -e;
        while true; do
          SITE="$${SITE_NAME:?SITE_NAME is not set}";
          TODAY="$$(date +%F)";
          DAY_OF_WEEK="$$(date +%u)";
          bench --site "$${SITE}" backup --with-files;
          SRC="sites/$${SITE}/private/backups";
          DEST="/backups/$${TODAY}";
          mkdir -p "$${DEST}";
          find "$${SRC}" -type f -mmin -10 -exec cp -a {} "$${DEST}"/ \;;
          if [ "$${DAY_OF_WEEK}" = "7" ]; then
            mkdir -p "/backups/weekly-$${TODAY}";
            cp -a "$${DEST}"/. "/backups/weekly-$${TODAY}"/;
          fi;
          find /backups -maxdepth 1 -type d -name "20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]" -mtime +7 -exec rm -rf {} + 2>/dev/null || true;
          find /backups -maxdepth 1 -type d -name "weekly-20[0-9][0-9]-[0-9][0-9]-[0-9][0-9]" -mtime +28 -exec rm -rf {} + 2>/dev/null || true;
          echo "Backup done for $${SITE} on $${TODAY}, stored in $${DEST}";
          sleep 86400;
        done;
    environment:
      SITE_NAME: "${SITE_NAME}"
    volumes:
      - "woodwolf-erpnext-sites:/home/frappe/frappe-bench/sites"
      - "woodwolf-erpnext-logs:/home/frappe/frappe-bench/logs"
      - "woodwolf-erpnext-backups:/backups"
    depends_on:
      create-site:
        condition: service_completed_successfully
      configurator:
        condition: service_completed_successfully

  db:
    image: "mariadb:11.8"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--skip-character-set-client-handshake"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - "woodwolf-erpnext-db-data:/var/lib/mysql"
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - "--connect"
        - "--innodb_initialized"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis-cache:
    image: "redis:6.2-alpine"

  redis-queue:
    image: "redis:6.2-alpine"
    command:
      - redis-server
      - "--appendonly"
      - "yes"
    volumes:
      - "woodwolf-erpnext-redis-queue-data:/data"

volumes:
  woodwolf-erpnext-db-data:
  woodwolf-erpnext-redis-queue-data:
  woodwolf-erpnext-sites:
  woodwolf-erpnext-logs:
  woodwolf-erpnext-backups:
